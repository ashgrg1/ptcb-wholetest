<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEA Schedules — Full Test Suite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F4F7F5; --ink:#12312B; --teal:#1E6B5C; --teal-soft:#E4EFEA;
    --amber:#C0813A; --amber-soft:#F3E7D3; --caution:#A63D28; --caution-soft:#F5E1DC;
    --good:#2E7D5B; --good-soft:#DDF0E6;
    --line:#CFDBD5; --white:#FFFFFF; --muted:#5c726b;
    --s1:#8a3d2e; --s2:#b25a35; --s3:#C0813A; --s4:#5c9c8c; --s5:#3f7d6e;
    --display:"Space Grotesk",system-ui,sans-serif;
    --body:"IBM Plex Sans",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  body{font-family:var(--body);color:var(--ink);background:var(--paper);line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
  .wrap{max-width:560px;margin:0 auto;padding:clamp(16px,4vw,30px) clamp(14px,4vw,26px) 46px;min-height:100vh;display:flex;flex-direction:column}

  .rx-tag{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--line);border-radius:2px;background:var(--white);align-self:flex-start}
  .rx-tag::before{content:"℞";font-size:14px;color:var(--amber)}
  h1{font-family:var(--display);font-weight:700;font-size:clamp(1.7rem,5vw,2.4rem);line-height:1;letter-spacing:-.02em;margin:12px 0 4px}
  .subtitle{color:var(--muted);font-size:.95rem;margin-bottom:18px}

  /* tabs */
  .tabs{display:flex;gap:6px;margin-bottom:20px}
  .tab{flex:1;font-family:var(--display);font-weight:700;font-size:1rem;padding:12px 4px;border:1px solid var(--line);background:var(--white);border-radius:6px;cursor:pointer;color:var(--ink);transition:all .15s;text-align:center}
  .tab small{display:block;font-family:var(--mono);font-weight:400;font-size:8.5px;letter-spacing:.04em;color:var(--muted);margin-top:3px;text-transform:uppercase}
  .tab:hover{border-color:var(--teal)}
  .tab[aria-selected="true"]{color:var(--white)}
  .tab[aria-selected="true"] small{color:rgba(255,255,255,.8)}
  .tab.t1[aria-selected="true"]{background:var(--s1);border-color:var(--s1)}
  .tab.t2[aria-selected="true"]{background:var(--s2);border-color:var(--s2)}
  .tab.t3[aria-selected="true"]{background:var(--s3);border-color:var(--s3)}
  .tab.t4[aria-selected="true"]{background:var(--s4);border-color:var(--s4)}
  .tab.t5[aria-selected="true"]{background:var(--s5);border-color:var(--s5)}
  .tab:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

  .screen{flex:1;display:flex;flex-direction:column}
  .hidden{display:none!important}
  .lede{color:#2c463f;font-size:1.02rem;max-width:46ch;margin-bottom:18px}

  .profile{border:1px solid var(--line);border-radius:6px;background:var(--white);margin-bottom:16px;overflow:hidden}
  .profile .hd{color:var(--white);padding:12px 16px;font-family:var(--display);font-weight:700;font-size:1.05rem;display:flex;align-items:center;gap:10px}
  .profile .hd .rn{font-size:1.3rem}
  .profile .bd{padding:14px 16px;font-size:.9rem}
  .profile .bd b{color:var(--teal)}
  .profile .bd .row{margin-bottom:7px}
  .profile .bd .row:last-child{margin-bottom:0}
  .mnemonic{font-family:var(--mono);font-size:.82rem;color:var(--muted);margin-bottom:22px;line-height:1.8}
  .mnemonic b{color:var(--ink)}

  .btn-primary{font-family:var(--display);font-weight:600;font-size:1.1rem;background:var(--ink);color:var(--white);border:none;border-radius:5px;padding:16px;cursor:pointer;transition:background .15s;width:100%}
  .btn-primary:hover{background:var(--teal)}
  .btn-primary:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

  .hud{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .stat{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center}
  .stat b{display:block;font-family:var(--display);font-weight:700;font-size:1.35rem;color:var(--ink);line-height:1}
  .stat.streak b{color:var(--amber)}
  .dots{display:flex;gap:4px;margin-bottom:18px}
  .dot{height:5px;flex:1;background:var(--white);border:1px solid var(--line);border-radius:3px}
  .dot.done{background:var(--teal);border-color:var(--teal)}
  .dot.miss{background:var(--caution);border-color:var(--caution)}

  .prompt{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:34px 20px;text-align:center;margin-bottom:16px;box-shadow:0 2px 0 var(--line)}
  .prompt .ask{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
  .prompt .ask b{color:var(--ink)}
  .prompt .drug{font-family:var(--display);font-weight:700;font-size:clamp(1.6rem,5.5vw,2.4rem);line-height:1.05;letter-spacing:-.01em}
  .prompt .brand{display:block;font-family:var(--body);font-weight:400;font-size:1rem;color:var(--muted);margin-top:8px}

  .yn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .yn button{font-family:var(--display);font-weight:700;font-size:1.1rem;border:1px solid var(--line);border-radius:8px;padding:20px 12px;cursor:pointer;transition:all .12s;background:var(--white)}
  .yn button:hover{transform:translateY(-1px)}
  .yn button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  .yn .yes{color:var(--good);border-color:#a9d3bf}
  .yn .no{color:var(--caution);border-color:#e0b9af}
  .yn .yes:hover{background:var(--good-soft)}
  .yn .no:hover{background:var(--caution-soft)}
  .yn button small{display:block;font-family:var(--mono);font-weight:400;font-size:.7rem;color:var(--muted);margin-top:4px;letter-spacing:.03em}
  .yn.locked button{pointer-events:none}
  .yn button.pick-right{background:var(--good-soft);border-color:var(--good)}
  .yn button.pick-wrong{background:var(--caution-soft);border-color:var(--caution)}

  .feedback{margin-top:16px;border-radius:6px;padding:16px 18px;display:none}
  .feedback.show{display:block}
  .feedback.right{background:var(--good-soft);border:1px solid var(--good)}
  .feedback.nope{background:var(--caution-soft);border:1px solid var(--caution)}
  .feedback .verdict{font-family:var(--display);font-weight:700;font-size:1.05rem;margin-bottom:5px}
  .feedback.right .verdict{color:var(--good)} .feedback.nope .verdict{color:var(--caution)}
  .feedback .why{color:var(--ink);font-size:.95rem}
  .feedback .why b{color:var(--teal)}
  .next-btn{margin-top:14px;font-family:var(--mono);font-size:14px;background:var(--amber);color:var(--white);border:none;border-radius:5px;padding:13px 20px;cursor:pointer;width:100%;transition:filter .15s}
  .next-btn:hover{filter:brightness(1.08)}
  .next-btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  .result{text-align:center;padding-top:10px}
  .grade{font-family:var(--display);font-weight:700;font-size:clamp(3rem,14vw,5rem);color:var(--teal);line-height:1}
  .score-line{font-family:var(--mono);font-size:.95rem;color:var(--muted);margin:6px 0 24px}
  .score-line b{color:var(--ink);font-size:1.1rem}
  .review{text-align:left;background:var(--white);border:1px solid var(--line);border-radius:6px;margin-bottom:20px;overflow:hidden}
  .review h3{font-family:var(--display);font-size:.95rem;padding:13px 16px;background:var(--amber-soft);border-bottom:1px solid var(--line)}
  .review .miss-row{display:flex;justify-content:space-between;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:.88rem}
  .review .miss-row:last-child{border-bottom:none}
  .review .miss-row .sch{font-family:var(--mono);color:var(--teal);font-weight:500;white-space:nowrap}
  .perfect{color:var(--good);font-weight:500;padding:16px;text-align:center}
  .again-row{display:flex;gap:8px}
  .again-row .btn-primary{flex:1}
  .btn-ghost{font-family:var(--display);font-weight:600;font-size:1rem;background:var(--white);color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:16px;cursor:pointer;flex:1;transition:all .15s}
  .btn-ghost:hover{border-color:var(--teal);color:var(--teal)}
  footer{margin-top:auto;padding-top:22px;font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center;letter-spacing:.04em}
</style>
</head>
<body>
<div class="wrap">
  <span class="rx-tag">PTCB · DEA Schedules Test Suite</span>
  <h1 id="mainTitle">DEA Schedule Trainer</h1>
  <p class="subtitle">Pick a schedule. Answer YES/NO. Master all five.</p>

  <div class="tabs" id="tabs">
    <button class="tab t1" data-s="1" role="tab">I<small>outlaws</small></button>
    <button class="tab t2" data-s="2" role="tab">II<small>strong</small></button>
    <button class="tab t3" data-s="3" role="tab">III<small>combos</small></button>
    <button class="tab t4" data-s="4" role="tab">IV<small>calming</small></button>
    <button class="tab t5" data-s="5" role="tab">V<small>lowest</small></button>
  </div>

  <!-- START -->
  <section class="screen" id="start">
    <p class="lede" id="startLede"></p>
    <div class="profile" id="profileBox">
      <div class="hd" id="profileHd"></div>
      <div class="bd" id="profileBd"></div>
    </div>
    <p class="mnemonic" id="mnemonicBox"></p>
    <button class="btn-primary" id="startBtn">Start · 15 rounds</button>
    <footer>℞ Study the profile, then trust your gut</footer>
  </section>

  <!-- PLAY -->
  <section class="screen hidden" id="play">
    <div class="hud">
      <div class="stat"><b id="score">0</b>correct</div>
      <div class="stat streak"><b id="streak">0</b>streak</div>
      <div class="stat"><b id="round">1</b>of 15</div>
    </div>
    <div class="dots" id="dots"></div>
    <div class="prompt">
      <div class="ask">Is this <b id="askSched">Schedule ?</b>?</div>
      <div class="drug" id="drugName"></div>
      <span class="brand" id="drugBrand"></span>
    </div>
    <div class="yn" id="yn">
      <button class="yes" data-a="1" id="yesBtn">✓ Yes<small>Y or ←</small></button>
      <button class="no" data-a="0" id="noBtn">✗ No<small>N or →</small></button>
    </div>
    <div class="feedback" id="feedback">
      <div class="verdict" id="verdict"></div>
      <div class="why" id="why"></div>
      <button class="next-btn" id="nextBtn">Next →</button>
    </div>
  </section>

  <!-- END -->
  <section class="screen hidden" id="end">
    <div class="result">
      <div class="grade" id="grade">A</div>
      <div class="score-line"><b id="finalScore">0</b> / 15 · <b id="finalAcc">0%</b> · best streak <b id="finalStreak">0</b></div>
    </div>
    <div class="review" id="review"></div>
    <div class="again-row">
      <button class="btn-primary" id="againBtn">Play again</button>
      <button class="btn-ghost" id="nextSchedBtn">Next schedule →</button>
    </div>
    <footer>℞ Aim for a clean run on all five</footer>
  </section>
</div>

<script>
const ROMAN={1:"I",2:"II",3:"III",4:"IV",5:"V"};
const COLOR={1:"var(--s1)",2:"var(--s2)",3:"var(--s3)",4:"var(--s4)",5:"var(--s5)"};
const ROUNDS=15;

// Per-schedule metadata for the start screen
const META={
  1:{lede:"A drug flashes up — is it Schedule I (no accepted medical use), or not? Learn the outlaws of the drug world.",
     profile:[["The idea:","no accepted medical use · highest abuse potential"],["The list:","heroin, LSD, MDMA (ecstasy), marijuana (federal), peyote"],["Why it matters:","these can't be prescribed at all"]],
     mnemonic:"<b>Memory hook:</b> Schedule <b>I</b> = <b>I</b>llegal / <b>I</b>llicit — nothing here is prescribable.<br>Animal pegs: HERON (heroin) · IGUANA (marijuana) · COYOTE (peyote)."},
  2:{lede:"A drug flashes up — is it Schedule II, or not? Master the exam's most-tested schedule and its sneaky look-alikes.",
     profile:[["What's in it:","strong opioids + stimulants that still have medical use"],["Opioids:","oxycodone, hydrocodone, morphine, fentanyl, methadone, hydromorphone"],["Stimulants:","amphetamine (Adderall), methylphenidate (Ritalin), Vyvanse"],["Also:","cocaine, secobarbital, pentobarbital"],["Rules:","NO refills · ordered on DEA Form 222"]],
     mnemonic:"<b>Remember:</b> II = no <b>ref-II-lls</b>.<br><b>Traps:</b> tramadol is IV · phenobarbital is IV (but seco/pentobarbital are II) · a codeine combo (Tylenol #3) is III."},
  3:{lede:"A drug flashes up — is it Schedule III, or not? Master the 'in-between' schedule and the drugs that switched over the years.",
     profile:[["The idea:","'in-between' — less abuse than II, more than IV"],["Codeine combos:","Tylenol with codeine #3 & #4, aspirin with codeine"],["Body & treatment:","anabolic steroids, testosterone, buprenorphine, ketamine"],["Also:","dronabinol (Marinol), benzphetamine, phendimetrazine"],["Rule:","III–V CAN be refilled — up to 5 times in 6 months"]],
     mnemonic:"<b>Best hook:</b> Tylenol <b>#3</b> → Schedule <b>III</b> (numbers match!).<br>III = <b>S</b>teroids · <b>S</b>uboxone · <b>K</b>etamine · codeine <b>C</b>ombos.<br><b>Trap:</b> Vicodin was III — it's now II."},
  4:{lede:"A drug flashes up — is it Schedule IV, or not? This is the land of the benzodiazepines and the sleepy '-pams.'",
     profile:[["The idea:","low abuse potential · mostly calming drugs"],["Benzodiazepines:","alprazolam (Xanax), lorazepam (Ativan), diazepam (Valium), clonazepam (Klonopin), temazepam, midazolam"],["Sleep 'Z-drugs':","zolpidem (Ambien), zaleplon, eszopiclone"],["Also:","tramadol, carisoprodol (Soma), phenobarbital, modafinil"],["Rule:","refills allowed — up to 5 in 6 months"]],
     mnemonic:"<b>Memory hook:</b> the calming <b>-pams</b> & <b>-zolams</b> live in IV.<br><b>Traps that fool people:</b> tramadol is IV (not II) · phenobarbital is IV (but seco/pentobarbital are II) · carisoprodol (Soma) is IV.<br>Animal pegs: ALLIGATOR (alprazolam) · slow LORIS (lorazepam) · CLOWNFISH (clonazepam)."},
  5:{lede:"A drug flashes up — is it Schedule V, or not? The lowest tier: cough and anti-diarrheal preps plus a couple of nerve drugs.",
     profile:[["The idea:","lowest abuse potential of all scheduled drugs"],["Cough preps:","codeine cough syrups (limited codeine, e.g. Robitussin AC)"],["Anti-diarrheal:","Lomotil (diphenoxylate/atropine)"],["Nerve drugs:","pregabalin (Lyrica); note lacosamide too"],["Rule:","some V drugs may be sold without a prescription where state law allows"]],
     mnemonic:"<b>Memory hook:</b> V = the 'Very least' abuse — mild <b>cough & Lyrica</b>.<br><b>Trap:</b> codeine COUGH SYRUP is V, but a codeine PILL combo (Tylenol #3) is III, and strong single-entity opioids are II.<br>Animal pegs: COD (codeine cough) · LYREBIRD (Lyrica)."}
};

// Master drug bank with each drug's TRUE schedule + a memory hook.
// Every schedule's quiz draws its own members + distractors from this bank.
const BANK=[
  // Schedule I
  {n:"Heroin", b:"", s:1, why:"No accepted medical use → Schedule I."},
  {n:"LSD", b:"", s:1, why:"Hallucinogen, no medical use → Schedule I."},
  {n:"MDMA", b:"ecstasy", s:1, why:"No medical use → Schedule I."},
  {n:"Marijuana", b:"federal", s:1, why:"Still Schedule I federally."},
  {n:"Peyote", b:"", s:1, why:"Hallucinogen → Schedule I."},
  // Schedule II
  {n:"Oxycodone", b:"OxyContin", s:2, why:"Strong opioid, medical use, no refills → Schedule II."},
  {n:"Hydrocodone", b:"", s:2, why:"Opioid, Schedule II since 2014 → no refills."},
  {n:"Morphine", b:"", s:2, why:"Potent opioid → Schedule II."},
  {n:"Fentanyl", b:"", s:2, why:"Very potent opioid → Schedule II."},
  {n:"Methadone", b:"", s:2, why:"Opioid → Schedule II (unlike buprenorphine, III)."},
  {n:"Hydromorphone", b:"Dilaudid", s:2, why:"Potent opioid → Schedule II."},
  {n:"Meperidine", b:"Demerol", s:2, why:"Opioid → Schedule II."},
  {n:"Oxymorphone", b:"Opana", s:2, why:"Opioid → Schedule II."},
  {n:"Tapentadol", b:"Nucynta", s:2, why:"Opioid → Schedule II (don't confuse with tramadol, IV)."},
  {n:"Amphetamine", b:"Adderall", s:2, why:"Stimulant, high abuse → Schedule II."},
  {n:"Methylphenidate", b:"Ritalin", s:2, why:"Stimulant → Schedule II."},
  {n:"Lisdexamfetamine", b:"Vyvanse", s:2, why:"Stimulant → Schedule II."},
  {n:"Cocaine", b:"", s:2, why:"Topical anesthetic use → Schedule II, not I."},
  {n:"Secobarbital", b:"Seconal", s:2, why:"This barbiturate is Schedule II (phenobarbital is IV)."},
  {n:"Pentobarbital", b:"", s:2, why:"Barbiturate → Schedule II (contrast phenobarbital = IV)."},
  // Schedule III
  {n:"Tylenol with codeine", b:"#3", s:3, why:"Codeine COMBO product → Schedule III. #3 → III."},
  {n:"Aspirin with codeine", b:"Empirin", s:3, why:"Codeine combo → Schedule III."},
  {n:"Buprenorphine", b:"Suboxone", s:3, why:"Treatment opioid → Schedule III (unlike methadone, II)."},
  {n:"Ketamine", b:"", s:3, why:"Anesthetic ('special K') → Schedule III."},
  {n:"Anabolic steroids", b:"", s:3, why:"Body-building drugs → Schedule III."},
  {n:"Testosterone", b:"", s:3, why:"Anabolic steroid → Schedule III."},
  {n:"Dronabinol", b:"Marinol", s:3, why:"Synthetic THC capsule → Schedule III."},
  {n:"Benzphetamine", b:"Didrex", s:3, why:"Diet stimulant → Schedule III (an exception to -phetamine=II)."},
  {n:"Phendimetrazine", b:"", s:3, why:"Diet stimulant → Schedule III."},
  // Schedule IV
  {n:"Alprazolam", b:"Xanax", s:4, why:"Benzodiazepine → Schedule IV."},
  {n:"Lorazepam", b:"Ativan", s:4, why:"Benzo → Schedule IV."},
  {n:"Diazepam", b:"Valium", s:4, why:"Benzo → Schedule IV."},
  {n:"Clonazepam", b:"Klonopin", s:4, why:"Benzo → Schedule IV."},
  {n:"Temazepam", b:"Restoril", s:4, why:"Benzo for sleep → Schedule IV."},
  {n:"Midazolam", b:"Versed", s:4, why:"Benzo → Schedule IV."},
  {n:"Zolpidem", b:"Ambien", s:4, why:"'Z-drug' sleep aid → Schedule IV."},
  {n:"Eszopiclone", b:"Lunesta", s:4, why:"'Z-drug' sleep aid → Schedule IV."},
  {n:"Tramadol", b:"", s:4, why:"Trap! Opioid-like but Schedule IV, not II."},
  {n:"Carisoprodol", b:"Soma", s:4, why:"Muscle relaxant → Schedule IV."},
  {n:"Phenobarbital", b:"", s:4, why:"Trap! This barbiturate is IV (seco/pentobarbital are II)."},
  {n:"Modafinil", b:"Provigil", s:4, why:"Wakefulness drug → Schedule IV."},
  {n:"Diethylpropion", b:"Tenuate", s:4, why:"Appetite suppressant → Schedule IV."},
  // Schedule V
  {n:"Codeine cough syrup", b:"Robitussin AC", s:5, why:"Limited-codeine cough prep → Schedule V."},
  {n:"Pregabalin", b:"Lyrica", s:5, why:"Nerve-pain drug → Schedule V."},
  {n:"Lomotil", b:"diphenoxylate/atropine", s:5, why:"Anti-diarrheal → Schedule V."},
  {n:"Lacosamide", b:"Vimpat", s:5, why:"Anti-seizure drug → Schedule V."},
];

let target=2, queue=[], idx=0, score=0, streak=0, best=0, misses=[];
const $=id=>document.getElementById(id);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

// Build a balanced round: ~half from the target schedule, ~half distractors
function buildQueue(sch){
  const inSched=shuffle(BANK.filter(d=>d.s===sch));
  const others=shuffle(BANK.filter(d=>d.s!==sch));
  const wantIn=Math.min(inSched.length, Math.ceil(ROUNDS*0.5));
  const chosen=[...inSched.slice(0,wantIn), ...others.slice(0,ROUNDS-wantIn)];
  return shuffle(chosen).slice(0,ROUNDS);
}

function selectTab(sch){
  target=sch;
  Array.from($('tabs').children).forEach(t=>t.setAttribute('aria-selected', Number(t.dataset.s)===sch));
  // show start screen for this schedule
  $('play').classList.add('hidden');$('end').classList.add('hidden');$('start').classList.remove('hidden');
  const m=META[sch];
  $('startLede').textContent=m.lede;
  $('profileHd').style.background=COLOR[sch];
  $('profileHd').innerHTML=`<span class="rn">${ROMAN[sch]}</span> The Schedule ${ROMAN[sch]} profile`;
  $('profileBd').innerHTML=m.profile.map(r=>`<div class="row"><b>${r[0]}</b> ${r[1]}</div>`).join('');
  $('mnemonicBox').innerHTML=m.mnemonic;
}

function startGame(){
  queue=buildQueue(target);
  idx=0;score=0;streak=0;best=0;misses=[];
  $('start').classList.add('hidden');$('end').classList.add('hidden');$('play').classList.remove('hidden');
  $('askSched').textContent='Schedule '+ROMAN[target];
  $('askSched').style.color=COLOR[target];
  const d=$('dots');d.innerHTML='';
  for(let i=0;i<ROUNDS;i++){const s=document.createElement('div');s.className='dot';s.id='dot'+i;d.appendChild(s);}
  render();
}
function render(){
  const drug=queue[idx];
  $('score').textContent=score;$('streak').textContent=streak;$('round').textContent=idx+1;
  $('drugName').textContent=drug.n;
  $('drugBrand').textContent=drug.b?('— '+drug.b):'';
  const yn=$('yn');yn.classList.remove('locked');
  Array.from(yn.children).forEach(b=>b.classList.remove('pick-right','pick-wrong'));
  $('feedback').className='feedback';
}
function answer(saidYes){
  const drug=queue[idx];const yn=$('yn');yn.classList.add('locked');
  const belongs = drug.s===target;
  const right = (saidYes===1)===belongs;
  const btns=Array.from(yn.children);
  const chosen = saidYes===1?btns[0]:btns[1];
  chosen.classList.add(right?'pick-right':'pick-wrong');
  if(!right){ (belongs?btns[0]:btns[1]).classList.add('pick-right'); }
  const dot=$('dot'+idx);
  if(right){score++;streak++;best=Math.max(best,streak);dot.classList.add('done');
    $('feedback').className='feedback show right';
    $('verdict').textContent= streak>=3?('Correct — '+streak+' in a row!'):'Correct!';
  }else{streak=0;misses.push(drug);dot.classList.add('miss');
    $('feedback').className='feedback show nope';
    $('verdict').textContent= belongs?('It IS Schedule '+ROMAN[target]):('Not Schedule '+ROMAN[target]+' — it\u2019s Schedule '+ROMAN[drug.s]);
  }
  $('why').innerHTML='<b>'+drug.n+'</b> — '+drug.why;
  $('score').textContent=score;$('streak').textContent=streak;
  $('nextBtn').textContent=(idx+1>=ROUNDS)?'See results →':'Next →';
  $('nextBtn').focus();
}
function next(){idx++;if(idx>=ROUNDS){end();return;}render();}
function end(){
  $('play').classList.add('hidden');$('end').classList.remove('hidden');
  const acc=Math.round(score/ROUNDS*100);
  let g='A+';if(acc<100)g='A';if(acc<90)g='B';if(acc<80)g='C';if(acc<70)g='D';if(acc<60)g='F';
  $('grade').textContent=g;$('finalScore').textContent=score;$('finalAcc').textContent=acc+'%';$('finalStreak').textContent=best;
  const rev=$('review');
  if(misses.length===0){rev.innerHTML='<div class="perfect">Perfect run — Schedule '+ROMAN[target]+' is locked in. ℞</div>';}
  else{
    let html='<h3>Review these ('+misses.length+')</h3>';const seen=new Set();
    misses.forEach(m=>{if(seen.has(m.n))return;seen.add(m.n);
      html+='<div class="miss-row"><span>'+m.n+(m.b?' <span style="color:var(--muted)">('+m.b+')</span>':'')+'</span><span class="sch">Schedule '+ROMAN[m.s]+'</span></div>';});
    rev.innerHTML=html;
  }
}

// wire tabs
Array.from($('tabs').children).forEach(t=>{
  t.addEventListener('click',()=>selectTab(Number(t.dataset.s)));
});
$('startBtn').addEventListener('click',startGame);
$('againBtn').addEventListener('click',startGame);
$('nextSchedBtn').addEventListener('click',()=>{selectTab(target>=5?1:target+1);});
$('nextBtn').addEventListener('click',next);
Array.from($('yn').children).forEach(b=>b.addEventListener('click',()=>answer(Number(b.dataset.a))));
document.addEventListener('keydown',e=>{
  if($('play').classList.contains('hidden'))return;
  const locked=$('yn').classList.contains('locked');
  if(!locked){
    if(e.key==='y'||e.key==='Y'||e.key==='ArrowLeft'){e.preventDefault();answer(1);}
    if(e.key==='n'||e.key==='N'||e.key==='ArrowRight'){e.preventDefault();answer(0);}
  }else if(e.key==='Enter'||e.key===' '){e.preventDefault();next();}
});

// boot
selectTab(2);
</script>
</body>
</html>
